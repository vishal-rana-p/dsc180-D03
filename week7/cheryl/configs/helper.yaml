apiVersion: v1
kind: Pod
metadata:
  name: cheryl-helper
spec:
  containers:
  - name: c
    image: ubuntu:22.04
    command: ["sleep", "3600"]
    resources:
      requests: {cpu: "1", memory: 2Gi}
      limits:   {cpu: "1", memory: 2Gi}
    volumeMounts: [{name: data, mountPath: /data}]
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: cheryl-data}
    