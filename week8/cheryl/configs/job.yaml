apiVersion: batch/v1
kind: Job
metadata: {name: cheryl-week8-pr}
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: gradients
        image: quay.io/jupyter/scipy-notebook:latest
        env:
        - {name: DATA_ROOT,    value: /data/climatebench/data/}
        - {name: OUT_DIR,      value: /data/week8/results}
        command: ["bash", "-c"]
        args:
        - |
          set -e
          pip install --quiet --no-cache-dir "jax==0.10.2" optax xarray netcdf4 cartopy
          python -c "import jax, optax, xarray, cartopy, netCDF4; print(jax.devices())"
          cd /data/week8
          jupyter nbconvert --to notebook --execute week8_pr.ipynb \
            --output week8_pr_executed.ipynb \
            --ExecutePreprocessor.timeout=-1 --ExecutePreprocessor.kernel_name=python3
        resources:
          requests: {cpu: "6", memory: 16Gi, ephemeral-storage: 10Gi}
          limits:   {cpu: "6", memory: 16Gi, ephemeral-storage: 10Gi}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: cheryl-data}
