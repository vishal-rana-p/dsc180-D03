atmosphere:
  constants: {}
  physics:
    checkpoint_terms: true
    terms:
      speedy_flags:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyFlags
      speedy_forcing:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyForcing
      speedy_humidity:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyHumidity
      speedy_convection:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyConvection
      speedy_large_scale_condensation:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyLargeScaleCondensation
      speedy_clouds:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyClouds
      speedy_shortwave_radiation:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyShortwaveRadiation
      speedy_downward_longwave:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyDownwardLongwaveRadiation
      speedy_surface_flux:
        _target_: jcm.physics.speedy.speedy_terms.SpeedySurfaceFlux
      speedy_upward_longwave:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyUpwardLongwaveRadiation
      speedy_vertical_diffusion:
        _target_: jcm.physics.speedy.speedy_terms.SpeedyVerticalDiffusion
  grid:
    vertical: sigma
    layers: 8
    spectral_truncation: 31
    spmd_mesh: null
    host_device_count: null
  dycore:
    name: dinosaur
    compute_omega: null
    advection: null
  run:
    time_step: 12
    save_interval: 10
    total_time: 10
    end_time: null
    start_time: null
    output_averages: false
    output: model_state.nc
    log_level: WARNING
    sponge:
      levels: 0
      timescale_h: 3.0
      enspodi: 2.0
      damp_temperature: true
      target_T_K: null
    chunk_days: 0
    output_prefix: chunked_run
    monthly_means: false
    save_chunks: true
    snapshot_interval: null
    snapshot_variables: []
    checkpoint_path: null
    archive_ckpt_every: 0
    bail_on_unhealthy: true
    mode: full
    state_file: null
    tracer_vars: null
    column:
      lat_deg: 0.0
      lon_deg: 0.0
  init:
    kind: isothermal
  terrain:
    kind: aquaplanet
  forcing:
    kind: default
    ozone_file: auto
    ozone_align: auto
    emissions_align: auto
    oxidants_align: auto
    ozone_persist: strict
    emissions_persist: strict
    oxidants_persist: strict
    emissions_file: auto
    dms_file: auto
    dust_file: auto
    dust_preferential_file: auto
    dust_soil_types_file: auto
    dust_regions_file: auto
    dust_roughness_file: auto
    oxidants_file: auto
    prescribed_surface_flux: null
  nudging:
    enabled: false
  diffusion:
    kind: auto
    scale: 1.0
    tracer_positivity: auto
ocean:
  _target_: jem.components.SlabOceanModel
  params:
    _target_: jem.components.slab.SlabOceanParameters
land: null
seaice:
  _target_: jem.components.SlabSeaiceModel
  params:
    _target_: jem.components.slab.SlabSeaiceParameters
coupling:
  timestep: 1 day
  workflow: null
  exchangers: null
  exchanger: null
  exchanged_forcing: null
regrid: null
coupled_run:
  total_time: 2 days
  end_time: null
  chunk: 2 days
  output_dir: null
  output_averages: false
  subsample: 1
  bail_on_unhealthy: true
  checkpoint_path: checkpoint
  initial_condition: null
  checkpoint_interval: null
  log_level: INFO
